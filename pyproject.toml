[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-data-tools"
version = "0.10.0"
description = "CLI for public YouTube data and authorized channel analytics"
authors = [
    { name = "Kenneth Liao", email = "kennyliao@theailaunchpad.io" },
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.169.0",
    "google-auth-oauthlib>=1.2.2",
    "platformdirs>=4.3.8",
    "python-dotenv>=1.1.0",
    "youtube-transcript-api>=1.0.3",
]

[project.scripts]
yt-tools = "yt_tools.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["yt_tools"]
